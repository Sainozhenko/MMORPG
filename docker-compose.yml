version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=mmo_db
      - POSTGRES_USER=mmo_user
      - POSTGRES_PASSWORD=mmo_password
    ports:
      - "5432:5432"

  
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8500:8000" 
    environment:
      - DJANGO_SECRET_KEY=your-temporary-dev-secret-key-12345
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://mmo_user:mmo_password@db:5432/mmo_db
    depends_on:
      - db

volumes:
  postgres_data: