{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-page-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div style="width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box;">
        <div style="background: rgba(10, 10, 10, 0.95); border: 2px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.15); padding: 30px; border-radius: 4px; font-family: 'Oswald', sans-serif;">
            
            <h2 style="font-family: 'Cinzel', serif; color: #f1c40f; margin-top: 0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 15px;">
                {% trans "Manage of person:" %} <span style="color: #fff;">{{ character.name }}</span>
            </h2>

            <form method="POST" style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
                {% csrf_token %}

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: #f1c40f; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">
                        {% trans "New nickname:" %}
                    </label>
                    <input type="text" name="new_name" value="{{ character.name }}" placeholder="{% trans 'Enter new nickname...' %}" required
                           style="background: #151515; border: 1px solid #333; color: #fff; padding: 10px; font-family: 'Oswald'; font-size: 16px; border-radius: 2px;">
                </div>

                {% if user.is_superuser %}
                    <div style="background: rgba(241, 196, 15, 0.05); border: 1px dashed #f1c40f; padding: 15px; border-radius: 2px; display: flex; flex-direction: column; gap: 5px;">
                        <label style="color: #f1c40f; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">
                            <i class="fas fa-user-shield"></i> {% trans "Change lvl (ADM-only):" %}
                        </label>
                        <input type="number" name="new_level" value="{{ character.level }}" min="1" max="80"
                               style="background: #151515; border: 1px solid #f1c40f; color: #fff; padding: 10px; font-family: 'Oswald'; font-size: 16px; border-radius: 2px;">
                        <small style="color: #666; font-size: 12px;">
                            {% trans "Players doesn't see this field." %}
                        </small>
                    </div>
                {% endif %}

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" style="flex: 1; background: #f1c40f; border: none; color: #000; padding: 12px; font-family: 'Oswald'; font-weight: bold; font-size: 16px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: 0.3s;">
                        {% trans "Save changes" %}
                    </button>
                    <a href="{% url 'profile' %}" style="display: block; text-align: center; background: #222; border: 1px solid #333; color: #aaa; padding: 12px; font-family: 'Oswald'; font-size: 16px; text-transform: uppercase; text-decoration: none; border-radius: 2px; width: 100px; box-sizing: border-box;">
                        {% trans "Return" %}
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
