{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card" style="text-align: center;">
        <i class="fas fa-envelope-open-text" style="color: #f1c40f; font-size: 48px; margin-bottom: 20px;"></i>
        
        <h2>
            {% trans "Verify Your Email Address" %}
        </h2>
        
        <p style="font-family: 'Oswald', sans-serif; color: #ccc; font-size: 15px; line-height: 1.6; margin-bottom: 25px;">
            {% trans "We have sent an e-mail to you for verification. Please check your inbox (and spam folder if you do not receive it shortly)." %}
        </p>
        
        <a href="{% url 'home' %}" class="auth-secondary-btn">
            {% trans "Back to Home" %}
        </a>
    </div>
</div>

<style>
    /* Добавляем стиль для второстепенной кнопки, чтобы она сочеталась с дизайном */
    .auth-secondary-btn {
        display: inline-block;
        width: 100%;
        padding: 12px;
        background: transparent;
        color: #f1c40f;
        border: 1px solid #f1c40f;
        font-family: 'Oswald', sans-serif;
        font-weight: bold;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 1px;
        box-sizing: border-box;
        transition: 0.3s ease-in-out;
    }

    .auth-secondary-btn:hover {
        background: #f1c40f;
        color: #000;
        box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
    }
</style>
{% endblock %}
