{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="mmo-auth-container">
    <div class="mmo-auth-card">
        <h2>{% trans "Password Changed" %}</h2>
        <p style="color: #fff; text-align: center; margin-bottom: 20px;">
            {% trans "Your password has been successfully updated. You can now log in with your new credentials." %}
        </p>
        <a href="{% url 'account_login' %}" class="mmo-submit-btn" style="display: block; text-align: center; text-decoration: none; padding: 12px; color: #000;">
            {% trans "Go to Login" %}
        </a>
    </div>
</div>

<style>
    .mmo-auth-container { display: flex; justify-content: center; align-items: center; padding: 100px 20px; }
    .mmo-auth-card { background: rgba(10, 10, 10, 0.95); border: 1px solid #f1c40f; padding: 40px; width: 450px; }
    .mmo-auth-card h2 { color: #f1c40f; text-align: center; text-transform: uppercase; font-family: 'Cinzel', serif; margin-bottom: 25px; }
    .mmo-submit-btn { background: #f1c40f; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; display: block; width: 100%; text-align: center; padding: 12px; color: #000; font-family: 'Oswald', sans-serif; }
</style>
{% endblock %}
